[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[project.scripts]
openhack = "cli.main:main"

[project]
name = "openhack"
version = "0.1.0"
description = "Open-source hackathon management platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "redis>=5.0",
    "apscheduler>=3.10",
    "python-jose>=3.3",
    "passlib>=1.7",
    "bcrypt>=4.1",
    "qrcode>=7.4",
    "pillow>=10.2",
    "pyjwt>=2.8",
    "qdrant-client>=1.8",
    "sendgrid>=6.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.52",
]
