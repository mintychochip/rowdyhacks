[package]
name = "openhack-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "net", "io-util"] }
tokio-util = "0.7"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
regex = "1"
rand = "0.8"
